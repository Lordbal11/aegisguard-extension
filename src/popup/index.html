<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AegisGuard Enterprise - SOC Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      width: 320px;
      margin: 0;
      background-color: #0f172a;
      color: #f8fafc;
    }
    .header {
      background: #1e293b;
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
    }
    .header h2 {
      font-size: 14px;
      margin: 0;
      color: #38bdf8;
    }
    .status-badge {
      font-size: 10px;
      background: #065f46;
      color: #6ee7b7;
      padding: 2px 6px;
      border-radius: 10px;
      font-weight: bold;
    }
    .container {
      padding: 12px;
    }
    .telemetry-feed {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      height: 160px;
      overflow-y: auto;
      padding: 8px;
      font-size: 11px;
      font-family: monospace;
      color: #cbd5e1;
      margin-bottom: 10px;
    }
    .btn-group {
      display: flex;
      gap: 6px;
    }
    button.action-btn {
      flex: 1;
      background: #0284c7;
      color: white;
      border: none;
      padding: 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
    }
    button.action-btn:hover {
      background: #0369a1;
    }
  </style>
</head>
<body>

  <div class="header">
    <h2>AegisGuard SOC</h2>
    <span class="status-badge">PROTECTED</span>
  </div>

  <div class="container">
    <div style="font-size: 11px; margin-bottom: 6px; color: #94a3b8;">Live Telemetry & Threat Logs:</div>
    <div id="log-container" class="telemetry-feed">
      [System] Initializing security worker...<br>
      [Ready] Monitoring DOM & Credential vectors.
    </div>

    <div class="btn-group">
      <button id="refresh-btn" class="action-btn">Refresh Data</button>
      <button id="open-pricing-btn" class="action-btn" style="background: #059669;">View Plans</button>
    </div>
  </div>

  <!-- Verification: Script tag correctly targets index.js -->
  <script src="index.js"></script>
</body>
</html>
